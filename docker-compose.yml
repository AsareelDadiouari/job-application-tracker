services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: jobtracker
      POSTGRES_USER: ${POSTGRES_USER:-jobtracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobtracker}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d jobtracker"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional: run the API in a container too (`docker compose --profile api up`).
  api:
    profiles: ["api"]
    build: ./api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=db;Port=5432;Database=jobtracker;Username=${POSTGRES_USER:-jobtracker};Password=${POSTGRES_PASSWORD:-jobtracker}
    ports:
      - "5223:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
